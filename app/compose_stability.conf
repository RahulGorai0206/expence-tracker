// Classes the Compose compiler should treat as stable.
//
// Compose cannot prove a kotlin.collections.List is immutable — the interface
// permits a mutable implementation — so any class holding one is inferred
// unstable, and every composable taking one as a parameter becomes
// non-skippable. In this app that made AnalyticsState, SplitEventState and
// SplitShareSummary unstable, so the charts redrew on every recomposition of
// their parent.
//
// This is a promise, not a proof. It holds here because every list reaching the
// UI is produced fresh and replaced wholesale — Room Flow emissions, or the
// result of map/filter — and none is ever mutated in place after being handed to
// Compose. If that ever changes, the UI will show stale data instead of
// recomposing, so keep building new lists rather than mutating existing ones.

kotlin.collections.List
kotlin.collections.Collection
kotlin.collections.Set
kotlin.collections.Map
